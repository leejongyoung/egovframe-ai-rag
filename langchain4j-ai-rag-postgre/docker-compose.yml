services:
  postgres:
    image: pgvector/pgvector:pg17  # PostgreSQL 17 + PGVector
    container_name: postgres-pgvector
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 설정하세요 (.env.example 참고)}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    ports:
      # 기본은 로컬 루프백만 게시. 원격 접속이 필요하면 POSTGRES_BIND_ADDRESS 를 명시적으로 변경한다.
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    command: postgres -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
